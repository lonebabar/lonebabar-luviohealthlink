<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reception | Luvio</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><a class="brand" href="index.html">Luvio HealthLink — Reception / Polyclinic</a><a class="btn" href="index.html">Home</a></header><main class="main"><h1>Reception Portal</h1><div class="grid">
<div class="card"><h2>Register New Patient</h2><div class="form"><label>Name<input id="rName"></label><label>Mobile<input id="rMobile"></label><label>DOB<input id="rDob" type="date"></label><label>Gender<input id="rGender"></label><label>BP<input id="rBp"></label><label>Pulse<input id="rPulse"></label><label>SpO₂<input id="rSpo2"></label><label>Weight<input id="rWeight"></label></div><br><button class="btn primary" onclick="registerPatient()">Create Luvio Patient ID</button><p id="result" class="notice"></p></div>
<div class="card"><h2>Search Existing Patient</h2><label>Patient ID<input id="searchId" placeholder="LH-000001"></label><label>Mobile<input id="searchMobile"></label><br><button class="btn" onclick="searchPatient()">Search</button><div id="searchResult"></div></div>
<div class="card"><h2>Appointment</h2><label>Patient ID<input id="aPatient"></label><label>Doctor<input id="aDoctor" value="Dr. A. Sharma"></label><label>Date & Time<input id="aDate" type="datetime-local"></label><br><button class="btn green" onclick="book()">Book Appointment</button></div>
</div></main><script src="luvio-core.js"></script><script src="reception.js"></script></body></html>
