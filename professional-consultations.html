<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Consultations | Luvio HealthLink</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fb;
    color:#17324d;
}

header{
    background:#fff;
    border-bottom:1px solid #dce6ed;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:700;
}

.brand-mark{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#17324d;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.brand small{
    display:block;
    font-size:10px;
    color:#71808c;
    font-weight:400;
}

.back{
    text-decoration:none;
    color:#17324d;
}

main{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

h1{
    margin-bottom:6px;
}

.sub{
    color:#71808c;
    margin-bottom:25px;
}

.panel{
    background:#fff;
    border:1px solid #dce6ed;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.search{
    width:100%;
    padding:12px;
    border:1px solid #ccd9e1;
    border-radius:8px;
    margin-bottom:20px;
}

.patient-card{
    border:1px solid #dce6ed;
    border-radius:10px;
    padding:18px;
    margin-bottom:12px;
}

.patient-card h3{
    margin-bottom:8px;
}

.meta{
    color:#617584;
    line-height:1.7;
    font-size:14px;
}

.actions{
    margin-top:15px;
}

button{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:600;
}

.primary{
    background:#17324d;
    color:#fff;
}

.notice{
    background:#f4f8fb;
    border:1px solid #dce6ed;
    padding:14px;
    border-radius:8px;
    color:#526875;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#e8f5ed;
    color:#23733c;
}

footer{
    text-align:center;
    padding:30px;
    color:#71808c;
    font-size:12px;
}

</style>

</head>

<body>

<header>

    <div class="brand">

        <div class="brand-mark">
            L
        </div>

        <div>
            Luvio HealthLink
            <small>
                Your Personal Health Architecture.
            </small>
        </div>

    </div>


    <a
        class="back"
        href="professional.html">

        ← Back to Professional Workspace

    </a>

</header>


<main>

<h1>Consultations</h1>

<p class="sub">
    Consultation queue for patients currently assigned to this professional.
</p>


<section class="panel">

    <input
        id="patientSearch"
        class="search"
        placeholder="Search patient by name or Patient ID..."
        oninput="renderQueue()"
    >


    <div id="queue"></div>

</section>

</main>


<footer>

    Luvio HealthLink ·
    Your Personal Health Architecture.

</footer>


<script>

const CURRENT_PROFESSIONAL_KEY =
    "luvio_current_doctor";

const PATIENTS_KEY =
    "luvio_patients";

const ASSIGNMENTS_KEY =
    "luvio_professional_patient_assignments";


/* =========================
   STORAGE
========================= */

function getJSON(key,fallback){

    try{

        return JSON.parse(
            localStorage.getItem(key) ||
            JSON.stringify(fallback)
        );

    }catch(e){

        return fallback;

    }

}


/* =========================
   CURRENT PROFESSIONAL
========================= */

const professional =
    getJSON(
        CURRENT_PROFESSIONAL_KEY,
        null
    );


/* =========================
   DATA
========================= */

function getPatients(){

    return getJSON(
        PATIENTS_KEY,
        []
    );

}


function getAssignments(){

    return getJSON(
        ASSIGNMENTS_KEY,
        []
    );

}


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,m => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m]));

}


/* =========================
   PROFESSIONAL CHECK
========================= */

function belongsToProfessional(a){

    if(!professional){
        return false;
    }


    const professionalId =
        professional.id ||
        professional.professionalId;


    return (

        String(a.professionalId || "") ===
        String(professionalId || "")

    )
    ||
    (

        String(a.professionalUserId || "") ===
        String(professional.userId || "")

    );

}


/* =========================
   FIND PATIENT
========================= */

function findPatient(patientId){

    return getPatients().find(
        p =>
            String(p.id) === String(patientId) ||
            String(p.patientId) === String(patientId)
    );

}


/* =========================
   RENDER QUEUE
========================= */

function renderQueue(){

    const queue =
        document.getElementById("queue");


    if(!professional){

        queue.innerHTML =
            `<div class="notice">

                No professional is currently logged in.

                <br><br>

                Please return to the Professional Portal
                and log in.

            </div>`;

        return;

    }


    const search =
        document
            .getElementById("patientSearch")
            .value
            .toLowerCase()
            .trim();


    let assignments =
        getAssignments()
            .filter(a =>

                belongsToProfessional(a)

                &&

                a.status === "Active"

            );


    let list =
        assignments
            .map(a => {

                const patient =
                    findPatient(
                        a.patientId
                    );


                if(!patient){
                    return null;
                }


                return {
                    assignment:a,
                    patient:patient
                };

            })
            .filter(Boolean);


    if(search){

        list =
            list.filter(item => {

                const p =
                    item.patient;


                const name =
                    String(
                        p.name ||
                        p.fullName ||
                        ""
                    ).toLowerCase();


                const id =
                    String(
                        p.id ||
                        p.patientId ||
                        ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    id.includes(search)
                );

            });

    }


    if(!list.length){

        queue.innerHTML =
            `<div class="notice">

                No patients are currently in
                your consultation queue.

            </div>`;

        return;

    }


    queue.innerHTML =
        list.map(item => {

            const p =
                item.patient;

            const a =
                item.assignment;

            const patientId =
                p.id ||
                p.patientId;


            return `

            <div class="patient-card">

                <h3>
                    ${esc(
                        p.name ||
                        p.fullName ||
                        "Patient"
                    )}
                </h3>


                <div class="meta">

                    Patient ID:
                    <b>${esc(patientId)}</b>

                    <br>

                    Mobile:
                    ${esc(
                        p.mobile ||
                        "Not provided"
                    )}

                    <br>

                    Organization:
                    ${esc(
                        a.organizationName ||
                        a.organizationId ||
                        "Not specified"
                    )}

                    <br>

                    <span class="status">
                        Ready for Consultation
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="primary"
                        onclick="openConsultation('${encodeURIComponent(patientId)}')">

                        Open Consultation

                    </button>

                </div>

            </div>

            `;

        })
        .join("");

}


/* =========================
   OPEN CONSULTATION
   IMPORTANT CONNECTION
========================= */

function openConsultation(encodedPatientId){

    const patientId =
        decodeURIComponent(
            encodedPatientId
        );


    if(!professional){

        alert(
            "Please log in to the Professional Portal first."
        );

        return;

    }


    const assignment =
        getAssignments().find(a =>

            String(a.patientId) ===
            String(patientId)

            &&

            belongsToProfessional(a)

            &&

            a.status === "Active"

        );


    if(!assignment){

        alert(
            "This patient is not currently assigned to this professional."
        );

        return;

    }


    /*
       THIS IS THE ACTUAL CONNECTION.

       It opens the NEW consultation page,
       not the old consultation page.
    */

    window.location.href =
        "professional-patient-consultation.html?patient=" +
        encodeURIComponent(patientId);

}


/* =========================
   INITIAL LOAD
========================= */

renderQueue();

</script>

</body>
</html>
