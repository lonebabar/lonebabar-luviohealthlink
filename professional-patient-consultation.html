<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Patients | Luvio HealthLink</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fb;
    color:#17324d;
}

header{
    background:#ffffff;
    border-bottom:1px solid #dce6ed;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:20px;
}

.brand-mark{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#17324d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.brand small{
    display:block;
    font-size:10px;
    color:#71808c;
    font-weight:400;
    margin-top:2px;
}

.back{
    text-decoration:none;
    color:#17324d;
    font-size:14px;
}

main{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

h1{
    margin-bottom:6px;
}

.sub{
    color:#71808c;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab{
    border:1px solid #d5e0e7;
    background:white;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
}

.tab.active{
    background:#17324d;
    color:white;
}

.panel{
    background:white;
    border:1px solid #dce6ed;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.search{
    width:100%;
    padding:12px;
    border:1px solid #ccd9e1;
    border-radius:8px;
    margin-bottom:20px;
}

.patient-card{
    border:1px solid #dce6ed;
    border-radius:10px;
    padding:18px;
    margin-bottom:12px;
    background:#fff;
}

.patient-card h3{
    margin-bottom:8px;
}

.meta{
    color:#617584;
    line-height:1.7;
    font-size:14px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:600;
}

.primary{
    background:#17324d;
    color:white;
}

.secondary{
    background:#eef4f7;
    color:#17324d;
}

.danger{
    background:#fbecec;
    color:#a33;
}

.notice{
    background:#f4f8fb;
    border:1px solid #dce6ed;
    padding:14px;
    border-radius:8px;
    color:#526875;
}

.hidden{
    display:none;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#eef4f7;
}

.status.active{
    background:#e8f5ed;
    color:#23733c;
}

.status.pending{
    background:#fff5df;
    color:#956500;
}

.status.declined{
    background:#fbecec;
    color:#a33;
}

footer{
    text-align:center;
    padding:30px;
    color:#71808c;
    font-size:12px;
}
</style>
</head>

<body>

<header>

    <div class="brand">
        <div class="brand-mark">L</div>

        <div>
            Luvio HealthLink
            <small>Your Personal Health Architecture.</small>
        </div>
    </div>

    <a class="back" href="professional.html">
        ← Back to Professional Workspace
    </a>

</header>


<main>

<h1>Patients</h1>

<p class="sub">
    Manage patient assignments and open authorized patient consultations.
</p>


<div class="tabs">

    <button class="tab active"
            onclick="showTab('pending',this)">
        Pending Patients
    </button>

    <button class="tab"
            onclick="showTab('my',this)">
        My Patients
    </button>

    <button class="tab"
            onclick="showTab('history',this)">
        Assignment History
    </button>

</div>


<!-- ========================= -->
<!-- PENDING PATIENTS -->
<!-- ========================= -->

<section id="pendingPanel" class="panel">

    <input
        id="pendingSearch"
        class="search"
        placeholder="Search pending patients..."
        oninput="renderPending()"
    >

    <div id="pendingList"></div>

</section>


<!-- ========================= -->
<!-- MY PATIENTS -->
<!-- ========================= -->

<section id="myPanel" class="panel hidden">

    <input
        id="mySearch"
        class="search"
        placeholder="Search my patients..."
        oninput="renderMyPatients()"
    >

    <div id="myPatientsList"></div>

</section>


<!-- ========================= -->
<!-- HISTORY -->
<!-- ========================= -->

<section id="historyPanel" class="panel hidden">

    <div id="historyList"></div>

</section>

</main>


<footer>
    Luvio HealthLink · Your Personal Health Architecture.
</footer>


<script>

const PATIENTS_KEY =
    "luvio_patients";

const ASSIGNMENTS_KEY =
    "luvio_professional_patient_assignments";

const CURRENT_PROFESSIONAL_KEY =
    "luvio_current_doctor";


/* =========================
   BASIC STORAGE FUNCTIONS
========================= */

function getJSON(key, fallback){

    try{

        return JSON.parse(
            localStorage.getItem(key) ||
            JSON.stringify(fallback)
        );

    }catch(e){

        return fallback;

    }

}


function setJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =========================
   CURRENT PROFESSIONAL
========================= */

function getCurrentProfessional(){

    return getJSON(
        CURRENT_PROFESSIONAL_KEY,
        null
    );

}


function getProfessionalId(){

    const professional =
        getCurrentProfessional();

    if(!professional){
        return null;
    }

    return (
        professional.id ||
        professional.professionalId ||
        ""
    );

}


/* =========================
   PATIENT DATA
========================= */

function getPatients(){

    return getJSON(
        PATIENTS_KEY,
        []
    );

}


function getAssignments(){

    return getJSON(
        ASSIGNMENTS_KEY,
        []
    );

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,m => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m]));

}


/* =========================
   PATIENT LOOKUP
========================= */

function findPatient(patientId){

    const patients =
        getPatients();

    return patients.find(
        p =>
            String(p.id) === String(patientId) ||
            String(p.patientId) === String(patientId)
    );

}


/* =========================
   PROFESSIONAL ASSIGNMENT
========================= */

function belongsToProfessional(assignment){

    const professional =
        getCurrentProfessional();

    if(!professional){
        return false;
    }

    const professionalId =
        professional.id ||
        professional.professionalId;

    return (
        String(assignment.professionalId || "") ===
        String(professionalId || "")
    )
    ||
    (
        String(assignment.professionalUserId || "") ===
        String(professional.userId || "")
    );

}


/* =========================
   TAB SWITCHING
========================= */

function showTab(tab,button){

    document
        .querySelectorAll(".tab")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    document
        .getElementById("pendingPanel")
        .classList.add("hidden");

    document
        .getElementById("myPanel")
        .classList.add("hidden");

    document
        .getElementById("historyPanel")
        .classList.add("hidden");


    if(tab === "pending"){

        document
            .getElementById("pendingPanel")
            .classList.remove("hidden");

        renderPending();

    }


    if(tab === "my"){

        document
            .getElementById("myPanel")
            .classList.remove("hidden");

        renderMyPatients();

    }


    if(tab === "history"){

        document
            .getElementById("historyPanel")
            .classList.remove("hidden");

        renderHistory();

    }

}


/* =========================
   PENDING PATIENTS
========================= */

function renderPending(){

    const professional =
        getCurrentProfessional();

    const container =
        document.getElementById("pendingList");

    if(!professional){

        container.innerHTML =
            `<div class="notice">
                No professional is currently logged in.
            </div>`;

        return;
    }


    const search =
        document
            .getElementById("pendingSearch")
            .value
            .toLowerCase()
            .trim();


    const assignments =
        getAssignments();


    let list =
        assignments.filter(a =>

            belongsToProfessional(a) &&
            a.status === "Pending"

        );


    list =
        list
            .map(a => {

                const patient =
                    findPatient(a.patientId);

                if(!patient){
                    return null;
                }

                return {
                    assignment:a,
                    patient:patient
                };

            })
            .filter(Boolean);


    if(search){

        list =
            list.filter(item => {

                const p =
                    item.patient;

                return (

                    String(
                        p.name ||
                        p.fullName ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        p.id ||
                        p.patientId ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            });

    }


    if(!list.length){

        container.innerHTML =
            `<div class="notice">
                No pending patient assignments.
            </div>`;

        return;

    }


    container.innerHTML =
        list.map(item => {

            const p =
                item.patient;

            const a =
                item.assignment;

            const patientId =
                p.id ||
                p.patientId;


            return `

            <div class="patient-card">

                <h3>
                    ${esc(
                        p.name ||
                        p.fullName ||
                        "Patient"
                    )}
                </h3>

                <div class="meta">

                    Patient ID:
                    <b>${esc(patientId)}</b>

                    <br>

                    Mobile:
                    ${esc(
                        p.mobile ||
                        "Not provided"
                    )}

                    <br>

                    Organization:
                    ${esc(
                        a.organizationName ||
                        a.organizationId ||
                        "Not specified"
                    )}

                    <br>

                    <span class="status pending">
                        Pending Assignment
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="primary"
                        onclick="acceptAssignment('${encodeURIComponent(patientId)}')">
                        Accept
                    </button>

                    <button
                        class="danger"
                        onclick="declineAssignment('${encodeURIComponent(patientId)}')">
                        Decline
                    </button>

                </div>

            </div>

            `;

        })
        .join("");

}


/* =========================
   ACCEPT ASSIGNMENT
========================= */

function acceptAssignment(encodedPatientId){

    const patientId =
        decodeURIComponent(
            encodedPatientId
        );


    const professional =
        getCurrentProfessional();


    const assignments =
        getAssignments();


    const professionalId =
        professional.id ||
        professional.professionalId;


    const assignment =
        assignments.find(a =>

            String(a.patientId) ===
            String(patientId)

            &&

            belongsToProfessional(a)

            &&

            a.status === "Pending"

        );


    if(!assignment){

        alert(
            "This patient assignment could not be found."
        );

        return;

    }


    assignment.status =
        "Active";

    assignment.acceptedAt =
        new Date().toISOString();


    assignment.acceptedBy =
        professionalId;


    setJSON(
        ASSIGNMENTS_KEY,
        assignments
    );


    renderPending();


    alert(
        "Patient assignment accepted."
    );

}


/* =========================
   DECLINE ASSIGNMENT
========================= */

function declineAssignment(encodedPatientId){

    const patientId =
        decodeURIComponent(
            encodedPatientId
        );


    const assignments =
        getAssignments();


    const assignment =
        assignments.find(a =>

            String(a.patientId) ===
            String(patientId)

            &&

            belongsToProfessional(a)

            &&

            a.status === "Pending"

        );


    if(!assignment){

        alert(
            "This patient assignment could not be found."
        );

        return;

    }


    assignment.status =
        "Declined";

    assignment.declinedAt =
        new Date().toISOString();


    setJSON(
        ASSIGNMENTS_KEY,
        assignments
    );


    renderPending();

}


/* =========================
   MY PATIENTS
========================= */

function renderMyPatients(){

    const container =
        document.getElementById(
            "myPatientsList"
        );


    const search =
        document
            .getElementById("mySearch")
            .value
            .toLowerCase()
            .trim();


    const assignments =
        getAssignments();


    let list =
        assignments.filter(a =>

            belongsToProfessional(a) &&
            a.status === "Active"

        );


    list =
        list
            .map(a => {

                const patient =
                    findPatient(a.patientId);

                if(!patient){
                    return null;
                }

                return {
                    assignment:a,
                    patient:patient
                };

            })
            .filter(Boolean);


    if(search){

        list =
            list.filter(item => {

                const p =
                    item.patient;

                return (

                    String(
                        p.name ||
                        p.fullName ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        p.id ||
                        p.patientId ||
                        ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            });

    }


    if(!list.length){

        container.innerHTML =
            `<div class="notice">
                No active patients are currently assigned to you.
            </div>`;

        return;

    }


    container.innerHTML =
        list.map(item => {

            const p =
                item.patient;

            const a =
                item.assignment;

            const patientId =
                p.id ||
                p.patientId;


            return `

            <div class="patient-card">

                <h3>
                    ${esc(
                        p.name ||
                        p.fullName ||
                        "Patient"
                    )}
                </h3>

                <div class="meta">

                    Patient ID:
                    <b>${esc(patientId)}</b>

                    <br>

                    Mobile:
                    ${esc(
                        p.mobile ||
                        "Not provided"
                    )}

                    <br>

                    Organization:
                    ${esc(
                        a.organizationName ||
                        a.organizationId ||
                        "Not specified"
                    )}

                    <br>

                    <span class="status active">
                        Active Patient
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="primary"
                        onclick="startConsultation('${encodeURIComponent(patientId)}')">
                        Start Consultation
                    </button>

                    <button
                        class="secondary"
                        onclick="openPatientRecord('${encodeURIComponent(patientId)}')">
                        Open Patient
                    </button>

                </div>

            </div>

            `;

        })
        .join("");

}


/* =========================
   START CONSULTATION
   THIS IS THE IMPORTANT
   CONNECTION
========================= */

function startConsultation(encodedPatientId){

    const patientId =
        decodeURIComponent(
            encodedPatientId
        );


    const professional =
        getCurrentProfessional();


    if(!professional){

        alert(
            "Please log in to the Professional Portal first."
        );

        return;

    }


    const assignments =
        getAssignments();


    const assignment =
        assignments.find(a =>

            String(a.patientId) ===
            String(patientId)

            &&

            belongsToProfessional(a)

            &&

            a.status === "Active"

        );


    if(!assignment){

        alert(
            "This patient is not currently active for this professional."
        );

        return;

    }


    /*
       NEW ACTUAL CONSULTATION PAGE

       Patient ID is passed in the URL.
       The consultation page will then
       identify the current professional
       from lu​​vio_current_doctor.
    */

    window.location.href =
        "professional-patient-consultation.html?patient=" +
        encodeURIComponent(patientId);

}


/* =========================
   OPEN PATIENT
========================= */

function openPatientRecord(encodedPatientId){

    /*
       For now, Open Patient also enters
       the authorized patient workspace.

       A separate Patient Record page
       can be created later.
    */

    startConsultation(
        encodedPatientId
    );

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );


    const assignments =
        getAssignments();


    let list =
        assignments.filter(a =>
            belongsToProfessional(a)
        );


    if(!list.length){

        container.innerHTML =
            `<div class="notice">
                No assignment history available.
            </div>`;

        return;

    }


    container.innerHTML =
        list
            .map(a => {

                const p =
                    findPatient(
                        a.patientId
                    );

                if(!p){
                    return "";
                }


                const patientId =
                    p.id ||
                    p.patientId;


                return `

                <div class="patient-card">

                    <h3>
                        ${esc(
                            p.name ||
                            p.fullName ||
                            "Patient"
                        )}
                    </h3>

                    <div class="meta">

                        Patient ID:
                        <b>${esc(patientId)}</b>

                        <br>

                        Organization:
                        ${esc(
                            a.organizationName ||
                            a.organizationId ||
                            "Not specified"
                        )}

                        <br>

                        Status:
                        <span class="status ${String(a.status || "").toLowerCase()}">
                            ${esc(a.status || "Unknown")}
                        </span>

                    </div>

                </div>

                `;

            })
            .join("");

}


/* =========================
   INITIAL LOAD
========================= */

renderPending();

</script>

</body>
</html>
